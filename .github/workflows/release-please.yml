on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Set up Node before the build so the smoke tests below run against the same
      # version the artifacts are published for, rather than the runner default.
      # registry-url is deliberately left to the publish step: it writes an .npmrc
      # referencing NODE_AUTH_TOKEN, which is not in scope until then.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Smoke test the built server
        # Guards against shipping a bundle that cannot start - every release up to
        # v0.8.0 shipped artifacts that crashed immediately on require.
        run: node build/index.js --help

      - name: Get package version
        id: package_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build desktop extension
        run: |
          bunx mcpb pack . "dist/aha-mcp-v${{ steps.package_version.outputs.version }}.mcpb"

      - name: Verify the desktop extension starts
        run: |
          bunx mcpb unpack "dist/aha-mcp-v${{ steps.package_version.outputs.version }}.mcpb" /tmp/mcpb-check
          node /tmp/mcpb-check/build/index.js --help

      - name: Upload desktop extension to Release
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            "dist/aha-mcp-v${{ steps.package_version.outputs.version }}.mcpb" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure npm registry auth
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          # Extract version from tag (e.g., aha-mcp-v0.2.0 -> 0.2.0)
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${VERSION#aha-mcp-v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major=$(echo ${VERSION} | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor=$(echo ${VERSION} | cut -d. -f1-2)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cedricziel/aha-mcp:latest
            ghcr.io/cedricziel/aha-mcp:${{ steps.version.outputs.version }}
            ghcr.io/cedricziel/aha-mcp:${{ steps.version.outputs.minor }}
            ghcr.io/cedricziel/aha-mcp:${{ steps.version.outputs.major }}
          labels: |
            org.opencontainers.image.source=https://github.com/cedricziel/aha-mcp
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          # Test that the image can start and respond to --help
          docker run --rm ghcr.io/cedricziel/aha-mcp:${{ steps.version.outputs.version }} --help

      - name: Test Docker image in stdio mode
        run: |
          # Test basic functionality without credentials
          timeout 5s docker run --rm ghcr.io/cedricziel/aha-mcp:${{ steps.version.outputs.version }} --mode stdio || true

      - name: Test Docker image in Streamable HTTP mode
        run: |
          # Test Streamable HTTP mode startup
          docker run --rm -d --name aha-mcp-test -p 3001:3001 ghcr.io/cedricziel/aha-mcp:${{ steps.version.outputs.version }} --mode streamable-http
          sleep 5
          # Check health endpoint
          curl -f http://localhost:3001/health || exit 1
          # Check info endpoint
          curl -f http://localhost:3001/ || exit 1
          # Cleanup
          docker stop aha-mcp-test

  # Publishes metadata only - the registry hosts nothing, it points at the npm package, the
  # ghcr image and the .mcpb asset. All three must already exist and carry their ownership
  # marker before the registry will accept the entry, hence `needs` on both publish jobs:
  # npm is checked for `mcpName` in package.json, ghcr for the image's
  # io.modelcontextprotocol.server.name label, and the release asset for its SHA-256.
  mcp-registry:
    needs: [release-please, publish, docker]
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      id-token: write # github-oidc login; no stored registry credential
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # server.json is committed with the version release-please bumps, but two fields it
      # cannot reach are filled in here: the ghcr tag is embedded in a string rather than
      # being a value of its own, and the .mcpb entry needs a hash of an artifact that does
      # not exist until the release is built.
      - name: Pin server.json to the released artifacts
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#aha-mcp-v}"
          MCPB_URL="https://github.com/cedricziel/aha-mcp/releases/download/${TAG}/aha-mcp-v${VERSION}.mcpb"
          curl -fsSL -o release.mcpb "$MCPB_URL"
          MCPB_SHA="$(sha256sum release.mcpb | cut -d' ' -f1)"
          jq --arg v "$VERSION" --arg url "$MCPB_URL" --arg sha "$MCPB_SHA" '
            .version = $v
            | .packages = [
                .packages[]
                | if .registryType == "npm" then .version = $v
                  elif .registryType == "oci" then .identifier = "ghcr.io/cedricziel/aha-mcp:" + $v
                  else . end
              ] + [
                {
                  registryType: "mcpb",
                  identifier: $url,
                  version: $v,
                  fileSha256: $sha,
                  transport: { type: "stdio" }
                }
              ]
          ' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
