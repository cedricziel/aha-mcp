---
# Dependabot configuration file
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
enable-beta-ecosystems: true
updates:
  # Enable version updates for Bun
  - package-ecosystem: "bun"
    # Look for bun.lock file in the root directory
    directory: "/"
    # Check for updates daily
    schedule:
      interval: "daily"
    assignees:
      - "cedricziel"
    groups:
      # Linting and commit-hook tooling moves together and never affects the
      # published bundle, so it arrives as one PR rather than one per package.
      # The eslint/prettier patterns are here so adding a linter later does not
      # silently start opening ungrouped PRs again.
      lint:
        patterns:
          - "commitlint"
          - "@commitlint/*"
          - "husky"
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "prettier"
          - "prettier-*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Look for GitHub Actions workflow files in the .github/workflows directory
    directory: "/"
    # Check for updates once a week
    schedule:
      interval: "daily"
    assignees:
      - "cedricziel"
